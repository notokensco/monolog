<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-1" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#9a80b3" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4d3b66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0e0f13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#5c8db8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#2d425c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0e0f13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-3" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#7e699b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e0f13" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a80b3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#9a80b3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ded7ec" fill-opacity="0.08"/>
    </pattern>

    <!-- Filters for Glow -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="1440" height="900" fill="#0d0e12"/>

  <!-- Aurora Blooms -->
  <circle cx="380" cy="240" r="450" fill="url(#bg-glow-1)" filter="url(#soft-blur)"/>
  <circle cx="1080" cy="580" r="420" fill="url(#bg-glow-2)" filter="url(#soft-blur)"/>
  <circle cx="720" cy="850" r="380" fill="url(#bg-glow-3)" filter="url(#soft-blur)"/>

  <!-- Dot Grid Texture -->
  <rect width="1440" height="900" fill="url(#dot-grid)"/>

  <!-- Floating Geometric Context Cards & Wireframes -->
  <!-- Background Card 1 (Tilted Screenshot Frame) -->
  <g transform="translate(140, 180) rotate(-7)" opacity="0.65">
    <rect width="260" height="340" rx="20" fill="url(#card-grad-1)" stroke="url(#border-light)" stroke-width="1"/>
    <!-- Wireframe Header -->
    <line x1="24" y1="35" x2="120" y2="35" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="52" x2="70" y2="52" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
    <!-- Image Box -->
    <rect x="24" y="75" width="212" height="150" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <!-- OCR Text Lines simulation -->
    <line x1="24" y1="245" x2="200" y2="245" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="262" x2="170" y2="262" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="279" x2="140" y2="279" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round"/>
    <!-- Badge -->
    <rect x="24" y="302" width="55" height="16" rx="8" fill="#9a80b3" fill-opacity="0.25"/>
    <text x="51" y="313" fill="#cfc2de" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" font-weight="600">SCREEN</text>
  </g>

  <!-- Background Card 2 (Audio Waveform Card) -->
  <g transform="translate(1020, 160) rotate(6)" opacity="0.6">
    <rect width="280" height="200" rx="20" fill="url(#card-grad-2)" stroke="url(#border-light)" stroke-width="1"/>
    <circle cx="45" cy="45" r="16" fill="#9a80b3" fill-opacity="0.25"/>
    <polygon points="42,38 52,45 42,52" fill="#e8e2f0"/>
    <line x1="75" y1="40" x2="160" y2="40" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="75" y1="52" x2="115" y2="52" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Sound Wave Bars -->
    <g transform="translate(30, 95)" stroke="#c4b5db" stroke-linecap="round" stroke-width="2.5" opacity="0.75">
      <line x1="10" y1="20" x2="10" y2="40"/>
      <line x1="22" y1="12" x2="22" y2="48"/>
      <line x1="34" y1="24" x2="34" y2="36"/>
      <line x1="46" y1="6"  x2="46" y2="54"/>
      <line x1="58" y1="16" x2="58" y2="44"/>
      <line x1="70" y1="22" x2="70" y2="38"/>
      <line x1="82" y1="8"  x2="82" y2="52"/>
      <line x1="94" y1="18" x2="94" y2="42"/>
      <line x1="106" y1="14" x2="106" y2="46"/>
      <line x1="118" y1="25" x2="118" y2="35"/>
      <line x1="130" y1="10" x2="130" y2="50"/>
      <line x1="142" y1="4"  x2="142" y2="56"/>
      <line x1="154" y1="18" x2="154" y2="42"/>
      <line x1="166" y1="22" x2="166" y2="38"/>
      <line x1="178" y1="12" x2="178" y2="48"/>
      <line x1="190" y1="20" x2="190" y2="40"/>
      <line x1="202" y1="26" x2="202" y2="34"/>
      <line x1="214" y1="16" x2="214" y2="44"/>
    </g>
    <text x="245" y="125" fill="#a499b2" font-family="system-ui, monospace" font-size="10">0:24</text>
    <line x1="30" y1="165" x2="220" y2="165" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Constellation Nodes & Connecting Fibers -->
  <g stroke="#9a80b3" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <path d="M 280,350 Q 520,280 720,380 T 1120,320"/>
    <path d="M 200,600 Q 580,720 880,540 T 1280,680"/>
  </g>
  <!-- Constellation Glow Dots -->
  <circle cx="280" cy="350" r="4" fill="#cfc2de" opacity="0.6"/>
  <circle cx="520" cy="280" r="3" fill="#cfc2de" opacity="0.4"/>
  <circle cx="720" cy="380" r="5" fill="#9a80b3" opacity="0.8"/>
  <circle cx="1120" cy="320" r="4" fill="#cfc2de" opacity="0.6"/>
  <circle cx="580" cy="720" r="3" fill="#64b5f6" opacity="0.5"/>
  <circle cx="880" cy="540" r="4" fill="#cfc2de" opacity="0.7"/>

  <!-- Bottom Gradient Fade into next section -->
  <rect y="760" width="1440" height="140" fill="url(#bg-glow-3)" opacity="0.6"/>
</svg>
