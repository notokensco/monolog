<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description"
    content="Interactive walkthrough of Monolog: an Android AI keyboard and companion journal. Step through Justysss’s story slide by slide." />
  <title>Monolog — Interactive Demo</title>
  <link rel="icon" type="image/png" href="/images/monolog-icon.png" />
  <link rel="apple-touch-icon" href="/images/monolog-icon.png" />
  <link rel="preload" as="image" href="/images/monolog-icon.png" />
  <script type="module" src="/src/demo-main.js"></script>
</head>

<body>
  <svg class="svg-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="2" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-journal" viewBox="0 0 24 24"><path d="M12 6v14m0-14C9 3.8 5.9 3.8 2.5 5v14c3.5-1.1 6.6-1 9.5 1 2.9-2 6-2.1 9.5-1V5C18.1 3.8 15 3.8 12 6Z"/></symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="icon-enter" viewBox="0 0 24 24"><path d="M20 4v10H4m5-5-5 5 5 5"/></symbol>
      <symbol id="icon-backspace" viewBox="0 0 24 24"><path d="m9 5-7 7 7 7h12V5H9Zm3 4 6 6m0-6-6 6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></symbol>
      <symbol id="icon-alarm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M4 2 1 5m19-3 3 3M7 20l-2 2m12-2 2 2"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></symbol>
      <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 9-13h-7l1-7Z"/></symbol>
      <symbol id="icon-rewrite" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
      <symbol id="icon-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
      <symbol id="icon-incognito" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="m7 11 2-6.5 3 2 3-2 2 6.5z"/><path d="M4 12h16M10 17h4"/><circle cx="7.5" cy="17" r="3"/><circle cx="16.5" cy="17" r="3"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M17.5 19H7a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.3 9.5 4.5 4.5 0 0 1 17.5 19Z"/></symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M4.5 3h4l1.5 5-2.6 2.2a14 14 0 0 0 6.4 6.4l2.2-2.6 5 1.5v4a1.5 1.5 0 0 1-1.6 1.5A18.5 18.5 0 0 1 3 4.6 1.5 1.5 0 0 1 4.5 3Z"/></symbol>
      <symbol id="icon-message" viewBox="0 0 24 24"><path d="M20 16a2 2 0 0 1-2 2H9l-5 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zM8 9h8m-8 4h5"/></symbol>
      <symbol id="icon-camera" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></symbol>
      <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9h.01M15 9h.01"/></symbol>
      <symbol id="icon-ellipsis" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-chevrons-down" viewBox="0 0 24 24"><path d="m6 7 6 6 6-6m-12 6 6 6 6-6"/></symbol>
      <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 21V4m-8 8 8-8 8 8"/></symbol>

      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="icon-sort" viewBox="0 0 24 24"><path d="M4 6h8M4 12h6M4 18h4m8-13v14m-4-4 4 4 4-4"/></symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-7 7M10 20H4v-6m0 6 7-7"/></symbol>
      <symbol id="icon-capture" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24"><path d="m8 3 8 0v2l-1 2v4l3 3v2H6v-2l3-3V7L8 5zm4 13v6"/></symbol>
      <symbol id="icon-accessibility" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.65" fill="currentColor" stroke="none"/><path d="M4.5 8.5c4.2.8 10.8.8 15 0M12 9v5.5m0 0-3 6m3-6 3 6"/></symbol>
      <symbol id="icon-bag" viewBox="0 0 24 24"><path d="M5 8h14l1 13H4zM8 9V6a4 4 0 0 1 8 0v3"/></symbol>
      <filter id="rear-mark-luminance" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-2 0 0 0 1.4 0 -2 0 0 1.4 0 0 -2 0 1.4 0 0 0 1 0"/></filter>
      <mask id="keyboard-m-mask" x="104" y="160" width="256" height="133" maskUnits="userSpaceOnUse">
        <image href="/images/monolog-icon.png" width="512" height="512" filter="url(#rear-mark-luminance)"/>
      </mask>
      <symbol id="icon-context-m" viewBox="104 160 256 133"><rect x="104" y="160" width="256" height="133" fill="currentColor" mask="url(#keyboard-m-mask)"/></symbol>
      <symbol id="icon-note-page" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zm8 0v5h4M9 12h6m-6 4h6"/></symbol>
    </defs>
  </svg>

  <div class="demo-page">
    <header class="demo-topbar">
      <div class="demo-topbar-left">
        <a href="/" class="wordmark" aria-label="Monolog home">monolog<span>.</span></a>
        <span class="demo-persistent-badge mono">Interactive demo</span>
      </div>

      <div class="demo-topbar-actions">
        <button id="scene-picker-toggle" class="topbar-btn" type="button" aria-expanded="false" aria-controls="scene-picker-panel">
          <svg class="icon" aria-hidden="true"><use href="#icon-layers"/></svg>
          <span>Scenes</span>
        </button>
        <button id="feature-browser-toggle" class="topbar-btn" type="button" aria-expanded="false" aria-controls="feature-browser-panel">
          <svg class="icon" aria-hidden="true"><use href="#icon-bolt"/></svg>
          <span>Browse features</span>
        </button>
        <button id="speaker-notes-toggle" class="topbar-btn" type="button" aria-pressed="false" aria-controls="speaker-notes-panel">
          <svg class="icon" aria-hidden="true"><use href="#icon-journal"/></svg>
          <span>Speaker notes</span>
        </button>
        <button id="demo-restart" class="topbar-btn topbar-btn-subtle" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
          <span>Restart</span>
        </button>
      </div>
    </header>

    <div id="scene-picker-panel" class="demo-popover" role="dialog" aria-label="Scene picker" hidden>
      <div class="demo-popover-head">
        <strong class="mono">Walkthrough scenes</strong>
        <button type="button" class="popover-close" data-close-popover aria-label="Close scene picker">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </div>
      <ol id="scene-picker-list" class="scene-picker-list"></ol>
    </div>

    <div id="feature-browser-panel" class="demo-popover" role="dialog" aria-label="Browse optional features" hidden>
      <div class="demo-popover-head">
        <strong class="mono">Browse features · Q&amp;A</strong>
        <button type="button" class="popover-close" data-close-popover aria-label="Close feature menu">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div id="feature-browser-list" class="feature-browser-list"></div>
      <div class="demo-popover-footer">
        <button id="return-to-story" type="button" class="popover-return-btn" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"/></svg>
          <span>Back to pitch walkthrough</span>
        </button>
      </div>
    </div>

    <main class="demo-stage-layout" id="demo-main">
      <section class="demo-meta-col" aria-label="Current scene">
        <div class="demo-progress-row">
          <span id="demo-progress" class="demo-progress mono">01 / 14</span>
          <span id="demo-mode-pill" class="demo-mode-pill mono" hidden>Feature preview</span>
        </div>

        <h1 id="demo-scene-title" class="demo-scene-title" aria-live="polite">Android home screen</h1>
        <span id="demo-action-announcement" class="sr-only" aria-live="polite"></span>
        <p id="demo-scene-caption" class="demo-scene-caption">Justysss and ybtheflash are about to pitch Monolog at the Buildathon finals.</p>

        <div id="demo-finish-actions" class="demo-finish-actions" hidden>
          <button type="button" id="finish-restart" class="finish-btn finish-btn-primary">
            <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
            <span>Restart</span>
          </button>
          <button type="button" id="finish-browse" class="finish-btn finish-btn-secondary">
            <svg class="icon" aria-hidden="true"><use href="#icon-bolt"/></svg>
            <span>Browse features</span>
          </button>
        </div>

        <aside id="speaker-notes-panel" class="speaker-notes-panel" aria-label="Presenter speaker notes" hidden>
          <div class="speaker-notes-head">
            <span class="mono">Speaker cue</span>
            <span id="speaker-duration" class="mono">~5s</span>
          </div>
          <p id="speaker-cue-text" class="speaker-cue-text"></p>
        </aside>
      </section>

      <section class="demo-phone-col" id="demo-phone-controls" data-theme="ink" aria-label="Simulated Android phone">
        <div class="demo-model-toolbar">
          <span class="mono">Drag to rotate</span>
          <button id="demo-phone-flip" type="button" aria-controls="demo-phone-front demo-phone-rear">View back</button>
        </div>
        <div class="demo-phone-stage" id="demo-phone-stage" data-phone-side="front" role="group" aria-label="Rotatable 3D Android phone running Monolog">
          <div class="demo-phone-float">
            <div class="demo-phone-body" id="demo-phone-body">
              <div class="demo-phone-frame" aria-hidden="true">
                <div class="demo-phone-rails"></div>
                <div class="demo-phone-buttons"><i></i><i></i></div>
                <div class="demo-phone-ports"><i></i></div>
              </div>
              <div class="demo-phone-face demo-phone-front" id="demo-phone-front">
                <div class="demo-phone-screen" id="demo-phone-screen">
                  <div class="phone-status-bar" id="phone-status-bar" aria-hidden="true">
                    <span class="status-time" id="phone-status-time">3:18</span>
                    <span class="demo-phone-selfie"></span>
                    <span class="status-right">
                      <span class="status-5g">5G</span>
                      <span class="demo-phone-indicators"><i></i><i></i></span>
                    </span>
                  </div>
                  <div class="phone-viewport" id="phone-viewport"></div>
                  <div class="phone-touch-layer" id="phone-touch-layer" aria-hidden="true"></div>
                </div>
              </div>
              <div class="demo-phone-face demo-phone-rear" id="demo-phone-rear" inert>
                <div class="demo-phone-cameras"><span></span><span></span><i></i></div>
                <button id="demo-phone-logo" type="button" aria-label="Switch phone to Paper" title="Switch phone to Paper"><svg class="rear-mark" viewBox="104 160 256 133" aria-hidden="true"><defs><filter id="rear-mark-luminance" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-2 0 0 0 1.4 0 -2 0 0 1.4 0 0 -2 0 1.4 0 0 0 1 0"/></filter><mask id="rear-mark-mask" x="104" y="160" width="256" height="133" maskUnits="userSpaceOnUse"><image href="/images/monolog-icon.png" width="512" height="512" filter="url(#rear-mark-luminance)"/></mask><linearGradient id="rear-mark-metal" x2="1" y2="1"><stop offset="12%" stop-color="var(--phone-brand)"/><stop offset="43%" stop-color="var(--phone-brand-light)"/><stop offset="59%" stop-color="var(--phone-brand)"/><stop offset="96%" stop-color="var(--phone-brand-light)"/></linearGradient></defs><rect x="104" y="160" width="256" height="133" fill="url(#rear-mark-metal)" mask="url(#rear-mark-mask)"/></svg></button>
              </div>
            </div>
          </div>
        </div>
        <div class="demo-model-finish" role="group" aria-label="Phone and keyboard finish">
          <button type="button" data-demo-theme="paper" aria-pressed="false">Paper</button>
          <button type="button" data-demo-theme="ink" aria-pressed="true">Ink</button>
        </div>
      </section>

      <nav class="demo-nav-col" aria-label="Presentation navigation">
        <div class="demo-nav-buttons">
          <button id="demo-prev" class="nav-deck-btn nav-prev" type="button" aria-label="Previous scene">
            <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"/></svg>
            <span class="nav-btn-copy">
              <strong>Previous</strong>
              <small class="mono">← Left Arrow</small>
            </span>
          </button>
          <span id="demo-nav-progress-mobile" class="demo-nav-progress-mobile mono" aria-hidden="true">01 / 14</span>
          <button id="demo-next" class="nav-deck-btn nav-next" type="button" aria-label="Next scene">
            <span class="nav-btn-copy">
              <strong>Next</strong>
              <small class="mono">Right Arrow →</small>
            </span>
            <svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
          </button>
        </div>
        <div class="demo-step-dots" id="demo-step-dots" role="group" aria-label="Jump to scene"></div>
      </nav>
    </main>
  </div>
</body>

</html>
